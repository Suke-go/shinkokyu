[package]
name = "shinkokyu-radar"
version = "0.2.0"
edition = "2021"

[lib]
name = "shinkokyu_radar"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
rustfft = "6"

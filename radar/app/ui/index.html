<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shinkokyu radar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle" data-quality="0">
  <header>
    <div class="base" aria-label="基準の計測の長さ（安定した呼吸が何分たまったら終えるか。0 は止めるまで続ける）">
      <button id="less" aria-label="1分短く">−</button>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <output id="mins">3</output>
      <button id="more" aria-label="1分長く">+</button>
    </div>
    <div class="bars" id="bars" role="img" aria-label="信号の質（1本: 何かが映っている、2本: 呼吸している人が映っている、3本: 呼吸が安定して区切れている）"><i></i><i></i><i></i></div>
  </header>
  <div class="big" id="br" aria-label="呼吸数（毎分）">
    <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M2 12c5-12 9-12 14 0s9 12 14 0 9-12 14 0"/></svg>
    <output>–</output>
  </div>
  <div class="small" id="hr" aria-label="心拍数（毎分）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.4 1.8-2.2 3.5-3.4 5.7-3.4 3.7 0 5.4 3.9 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <output>–</output>
  </div>
  <canvas id="trace" aria-label="呼吸の波形（直近30秒。縦の線は1呼吸の区切り）"></canvas>
  <canvas id="seen" aria-label="レーダーに映っているもの（左が近く、右が遠く。濃いほど強い反射）"></canvas>
  <nav>
    <button class="go" id="task" aria-label="タイピング課題を開く">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16.5 4a2 2 0 0 1 3 3L8 18.5 4 20zM14.5 6l3 3"/></svg>
    </button>
    <button id="toggle" aria-label="測定開始"><span></span></button>
    <button class="go" id="dash" aria-label="ダッシュボードを開く">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M8 15l3.5-4 3 2.5L19 8"/></svg>
    </button>
  </nav>
  <p id="note" role="status"></p>
  <script type="module" src="main.js"></script>
</body>
</html>

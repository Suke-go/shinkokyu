<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>転記タイピング実験</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.7 "Segoe UI", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 96px 16px 48px; }
  h1 { font: 600 28px/1.4 "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; margin: 0 0 32px; text-align: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  a.card { display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 32px 24px; color: inherit; text-decoration: none; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  a.card b { display: block; font-size: 20px; margin-bottom: 8px; }
  a.card span { color: var(--ink-2); }
  #note { margin-top: 32px; text-align: center; color: var(--ink-2); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>転記タイピング実験</h1>
  <div class="cards">
    <a class="card" href="experiment/"><b>実験を始める</b><span>課題文を見ながら、下の欄に書き写します。</span></a>
    <a class="card" href="dashboard/"><b>ダッシュボード</b><span>記録したセッションの入力速度と停止をふり返ります。</span></a>
  </div>
  <p id="note" hidden>静的デモ版：記録はこのブラウザに保存され、完了時にJSONをダウンロードします</p>
</main>
<script type="module">
  import { MODE } from "./shared/backend.js";
  if (MODE === "static") document.getElementById("note").hidden = false;
</script>
</body>
</html>

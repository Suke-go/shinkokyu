<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Timeline</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <span class="brand">Typing Timeline</span>
  <div class="picker" id="picker">
    <button id="pk-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="pk-list" aria-label="セッションを選択">
      <span class="pk-main"><b id="pk-id">—</b><span id="pk-sub" class="pk-sub"></span></span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
    </button>
    <ul id="pk-list" role="listbox" tabindex="-1" aria-label="セッション" hidden></ul>
  </div>
  <div class="actions">
    <button id="share" class="ghost" type="button" title="このセッションのこの時点へのリンクをコピー">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.3-2.3a3 3 0 0 0-4.2-4.2l-.8.8M9.5 6.5a3 3 0 0 0-4.2 0L3 8.8A3 3 0 0 0 7.2 13l.8-.8"/></svg>
      <span id="share-label">リンクをコピー</span>
    </button>
    <div class="exp"><button id="export" class="ghost" type="button">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11"/></svg>
      <span id="export-label">エクスポート</span>
    </button><div id="dl" class="dl" hidden></div></div>
    <button id="fs" class="icon" type="button" aria-label="全画面表示" title="全画面表示">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
    </button>
  </div>
</header>
<main id="main" class="split">
  <section class="left">
    <div class="hero"><span id="sentence" class="sentence"></span><span id="syncwarn" class="syncwarn" hidden>時刻同期に問題あり</span></div>
    <div id="chart" class="chart" tabindex="0"></div>
    <div id="tip" class="tip" hidden></div>
    <div id="figs" class="figs num"></div>
  </section>
  <section class="right" aria-label="入力のリプレイ">
    <div class="stage"><div id="sheet" class="sheet" aria-live="off"></div></div>
    <div class="transport">
      <button id="play" class="icon play" type="button" aria-label="再生" title="再生 / 一時停止 (Space)"></button>
      <div class="speeds" id="speeds" role="group" aria-label="再生速度"></div>
      <input id="seek" type="range" min="0" max="1" value="0" step="100" aria-label="シーク">
      <span id="time" class="time num">0:00 / 0:00</span>
    </div>
  </section>
</main>
<div id="empty" class="empty" hidden>
  <p id="empty-msg">セッションがまだありません</p>
  <code id="empty-hint">node tools/make-demo.js</code>
  <button id="open-file" class="linkbtn" type="button">ファイルを開く</button>
</div>
<input id="file" type="file" accept=".json,application/json" multiple hidden>
<script type="module" src="app.js"></script>
</body>
</html>
